[package]
name = "modlinker"
version = "1.0.0"
description = "Minecraft MOD Sync Client"
authors = ["you"]
edition = "2021"

[lib]
name = "modlinker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
walkdir = "2"
futures = "0.3"
aws-sdk-s3 = "1.148.0"
aws-config = "1.12.0"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-fs = "2.5.2"
zip = "8.6.0"
toml = "1.1.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
